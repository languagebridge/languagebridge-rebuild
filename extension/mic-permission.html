<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LanguageBridge — Enable Microphone</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #742a69 0%, #f37030 80%, #ffc755 100%);
      color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: rgba(0,0,0,0.18); border-radius: 20px; padding: 40px; max-width: 460px;
      text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.5; opacity: 0.95; margin: 0 0 24px; }
    button { font-size: 18px; font-weight: 700; padding: 16px 32px; border: none; border-radius: 14px;
      background: #fff; color: #742a69; cursor: pointer; }
    button:hover { transform: translateY(-2px); }
    .status { margin-top: 20px; font-size: 15px; min-height: 22px; }
    .ok { color: #d8ffd8; } .err { color: #ffd8d8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Turn on the microphone</h1>
    <p>LanguageBridge needs microphone access so Talk to Teacher can hear and translate speech. You only have to do this once.</p>
    <button id="grant">Allow microphone</button>
    <div class="status" id="status"></div>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
